<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUC student management app</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"

    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
  <h3 class="bg-info text-center">TUC student management app</h3>

  <section>
    <div class="container">
      <div class="col-md-12 mt-4">
        <div class="card stdform">
          <div class="card-body">
            <h4 class="bg-primary text-center">Add student</h4>
            <form class="form-row" id="studentForm">
              <div class="col-md-6 form-group">
                <label for="name">Enter student name</label>
                <input type="text" id="name" class="form-control">
              </div>
              <div class="col-md-6 form-group">
                <label for="address">Enter address</label>
                <input type="text" id="address" class="form-control">
              </div>
              <div class="col-md-3 form-group">
                <label for="batch">Student batch with year</label>
                <input type="text" id="batch" class="form-control">
              </div>
              <div class="col-md-3 form-group">
                <label for="feesPaid">Fees paid</label>
                <input type="number" id="feesPaid" class="form-control">
              </div>
              <div class="col-md-3 form-group">
                <label for="feesPending">Fees pending</label>
                <input type="number" id="feesPending" class="form-control">
              </div>
              <div class="col-md-3">
                <label for="contact">Contact number</label>
                <input type="text" id="contact" class="form-control">
              </div>
              <div class="col-6 offset-3">
                <button type="submit" id="addStudentBtn" class="btn btn-primary btn-sm btn-block mt-2">Add student</button>
                <button type="button" id="updateStudentBtn" class="btn btn-primary btn-sm btn-block d-none mt-2">Update student</button>
              </div>

            </form>
          </div>
        </div>
      </div>
</div>

      <div class="container-fluid">
        <div class="row">
          <div class="col-md-12 mt-3">
            <div class="card">
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-bordered table-hover">
                    <thead class="bg-warning">
                      <tr>
                        <th>Sr no</th>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Batch with year</th>
                        <th>Fee paid</th>
                        <th>Fee pending</th>
                        <th>Contact</th>
                        <th>Edit</th>
                        <th>Remove</th>
                      </tr>
                    </thead>

                    <tbody id="studentTable">
                      <!-- <tr>
                        <td>01</td>

                        <td class="text-center"><button class="btn btn-sm btn-danger" id="deleteBtn">Delete</button>
                        </td>
                      </tr> -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

    
  </section>
